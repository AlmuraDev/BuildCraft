// The expression engine is plain Java. The main build compiles its sources straight into the BuildCraft jar; this project only
// runs the generator that writes src/autogen/java (not in git) and the engine's own tests.
plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

sourceSets {
    main {
        java {
            srcDir 'src/autogen/java'
        }
    }
    // src/generator/java and src/generator/resources (the default dirs)
    generator {}
}

dependencies {
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    generatorImplementation 'com.google.code.findbugs:jsr305:3.0.2'
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def autogenDir = file('src/autogen/java')

tasks.register('generateSources', JavaExec) {
    classpath = sourceSets.generator.runtimeClasspath
    mainClass = 'buildcraft.meta.generate.AutoGenerator'
    args '-out', autogenDir.absolutePath, '-run', '-quiet'
    workingDir = projectDir
    inputs.files(sourceSets.generator.allSource)
    outputs.dir(autogenDir)
    doFirst {
        delete new File(autogenDir, 'buildcraft')
    }
}

tasks.named('compileJava') { dependsOn 'generateSources' }
