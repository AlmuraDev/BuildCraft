# One jar, several BuildCraft mods. Each mod is added here when its part of BuildCraft is ported to 26.3.
modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/AlmuraDev/BuildCraft/issues"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[mods]]
modId = "buildcraftlib"
version = "${version}"
displayName = "BuildCraft Lib"
bannerFile = "assets/buildcraft/logo.png"
credits = "Created by SpaceToad"
authors = "SpaceToad, BuildCraft Team, AlmuraDev"
displayURL = "https://www.mod-buildcraft.com/"
description = '''Library mod used by BuildCraft.'''

[[dependencies.buildcraftlib]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.buildcraftlib]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[mods]]
modId = "buildcraftcore"
version = "${version}"
displayName = "BuildCraft"
bannerFile = "assets/buildcraft/logo.png"
credits = "Created by SpaceToad"
authors = "SpaceToad, BuildCraft Team, AlmuraDev"
displayURL = "https://www.mod-buildcraft.com/"
description = '''Extending Minecraft with pipes, auto-crafting, quarries, engines and much more!'''

[[dependencies.buildcraftcore]]
modId = "buildcraftlib"
type = "required"
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[mods]]
modId = "buildcrafttransport"
version = "${version}"
displayName = "BuildCraft Transport"
bannerFile = "assets/buildcraft/logo.png"
credits = "Created by SpaceToad"
authors = "SpaceToad, BuildCraft Team, AlmuraDev"
displayURL = "https://www.mod-buildcraft.com/"
description = '''Pipes, wires and pluggables for moving items, fluids and power.'''

[[dependencies.buildcrafttransport]]
modId = "buildcraftcore"
type = "required"
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[mods]]
modId = "buildcraftenergy"
version = "${version}"
displayName = "BuildCraft Energy"
bannerFile = "assets/buildcraft/logo.png"
credits = "Created by SpaceToad"
authors = "SpaceToad, BuildCraft Team, AlmuraDev"
displayURL = "https://www.mod-buildcraft.com/"
description = '''Engines, oil and fuels.'''

[[dependencies.buildcraftenergy]]
modId = "buildcraftcore"
type = "required"
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[mods]]
modId = "buildcraftfactory"
version = "${version}"
displayName = "BuildCraft Factory"
bannerFile = "assets/buildcraft/logo.png"
credits = "Created by SpaceToad"
authors = "SpaceToad, BuildCraft Team, AlmuraDev"
displayURL = "https://www.mod-buildcraft.com/"
description = '''Pumps, tanks, mining wells, flood gates, distillers and other machines.'''

[[dependencies.buildcraftfactory]]
modId = "buildcraftcore"
type = "required"
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[mods]]
modId = "buildcraftsilicon"
version = "${version}"
displayName = "BuildCraft Silicon"
bannerFile = "assets/buildcraft/logo.png"
credits = "Created by SpaceToad"
authors = "SpaceToad, BuildCraft Team, AlmuraDev"
displayURL = "https://www.mod-buildcraft.com/"
description = '''Lasers, assembly and integration tables, gates, lenses and facades.'''

[[dependencies.buildcraftsilicon]]
modId = "buildcraftcore"
type = "required"
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.buildcraftsilicon]]
modId = "buildcrafttransport"
type = "optional"
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[mods]]
modId = "buildcraftbuilders"
version = "${version}"
displayName = "BuildCraft Builders"
bannerFile = "assets/buildcraft/logo.png"
credits = "Created by SpaceToad"
authors = "SpaceToad, BuildCraft Team, AlmuraDev"
displayURL = "https://www.mod-buildcraft.com/"
description = '''Quarries, fillers, builders, architect tables and blueprints.'''

[[dependencies.buildcraftbuilders]]
modId = "buildcraftcore"
type = "required"
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"

[[mods]]
modId = "buildcraftrobotics"
version = "${version}"
displayName = "BuildCraft Robotics"
bannerFile = "assets/buildcraft/logo.png"
credits = "Created by SpaceToad"
authors = "SpaceToad, BuildCraft Team, AlmuraDev"
displayURL = "https://www.mod-buildcraft.com/"
description = '''The zone planner, for drawing zones on map locations.'''

[[dependencies.buildcraftrobotics]]
modId = "buildcraftcore"
type = "required"
versionRange = "[${version}]"
ordering = "AFTER"
side = "BOTH"
