// BuildCraft for Minecraft 26.3 on NeoForge. The code stays where it was on 1.12.2 (common/, BuildCraftAPI/api,
// sub_projects/expression) so its history carries over; one jar holds all eight BuildCraft mods.

plugins {
    id 'java-library'
    // see https://projects.neoforged.net/neoforged/moddevgradle
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mod_version}"
group = project.group

base {
    archivesName = "buildcraft-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
}

// The parts of BuildCraft ported to 26.3 so far. Everything else under common/ is still 1.12.2 code and stays out of the
// build until its batch is ported.
def portedPackages = [
        'buildcraft/api/**',
        'buildcraft/lib/**',
        'buildcraft/core/**',
]

def mainResourceDirs = ['buildcraft_resources', 'BuildCraft-Localization', 'BuildCraftGuide/guide_resources']

sourceSets {
    main {
        java {
            srcDirs = ['common', 'BuildCraftAPI/api',
                       'sub_projects/expression/src/main/java', 'sub_projects/expression/src/autogen/java']
            include portedPackages
        }
        resources {
            srcDirs = mainResourceDirs
            exclude '**/*.md', 'mcmod.info', 'pack.png', 'pack.mcmeta'
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
            include portedPackages
        }
        resources { srcDirs = [] }
    }
}


def modIds = ['buildcraftlib', 'buildcraftcore', 'buildcraftbuilders', 'buildcraftenergy', 'buildcraftfactory',
              'buildcraftrobotics', 'buildcraftsilicon', 'buildcrafttransport']

neoForge {
    version = neoforge_version

    runs {
        configureEach {
            ideName = "BuildCraft ${it.name.capitalize()}"
            logLevel = org.slf4j.event.Level.INFO
            systemProperty 'buildcraft.dev', 'true'
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            programArgument('--nogui')
            gameDirectory = project.file('runs/server')
        }
    }

    mods {
        modIds.each { id ->
            "${id}" {
                sourceSet sourceSets.main
            }
        }
    }
}

dependencies {
    // Trove came with Minecraft 1.12.2 but not 26.3: BuildCraft bundles it (jar-in-jar)
    jarJar(implementation('net.sf.trove4j:trove4j')) {
        version {
            strictly '[3.0.3,4.0)'
            prefer '3.0.3'
        }
    }

    testImplementation 'junit:junit:4.13.2'
}

// The expression engine's generated sources (src/autogen/java) come from the sub-project's generator
tasks.named('compileJava') { dependsOn ':sub_projects:expression:generateSources' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

processResources {
    var expandProps = [
            'version'                      : version,
            'mod_license'                  : mod_license,
            'minecraft_version_range'      : minecraft_version_range,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range
    ]
    filesMatching('META-INF/neoforge.mods.toml') {
        expand expandProps
    }
    inputs.properties(expandProps)
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Implementation-Title'  : 'BuildCraft',
                'Implementation-Version': project.version,
                'Implementation-Vendor' : 'SpaceToad, BuildCraft Team, AlmuraDev'
        ])
    }
}
