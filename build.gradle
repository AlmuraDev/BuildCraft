// BuildCraft for Minecraft 26.3 on NeoForge. The code stays where it was on 1.12.2 (common/, BuildCraftAPI/api,
// sub_projects/expression) so its history carries over; one jar holds all eight BuildCraft mods.

plugins {
    id 'java-library'
    // see https://projects.neoforged.net/neoforged/moddevgradle
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mod_version}"
group = project.group

base {
    archivesName = "buildcraft-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
}

// The parts of BuildCraft ported to 26.3 so far. Everything else under common/ is still 1.12.2 code and stays out of the
// build until its batch is ported.
def portedPackages = [
        'buildcraft/api/**',
        'buildcraft/lib/**',
        'buildcraft/core/**',
        'buildcraft/transport/**',
        'buildcraft/energy/**',
        'buildcraft/factory/**',
        'buildcraft/silicon/**',
        'buildcraft/builders/**',
        'buildcraft/robotics/**',
]

// Client code inside the ported packages that isn't ported yet: the guide book (its own batch), the config screen,
// special item models and a few 1.12.2-only render helpers. The server side compiles without them.
def deferredSources = [
        'buildcraft/lib/client/ToastInformation.java',
        // the guide's AWT-font renderer (the guide uses Minecraft's font on 26.3) and 1.12.2 FontRenderer subclasses
        'buildcraft/lib/client/render/font/**',
        'buildcraft/lib/client/guide/font/FontManager.java',
        'buildcraft/lib/client/guide/font/GuideFont.java',
        // 1.12.2 atlas stitching tricks (unused) and the guide's dynamic texture
        'buildcraft/lib/client/sprite/Atlas*.java',
        'buildcraft/lib/client/sprite/DynamicTextureBC.java',
        'buildcraft/lib/misc/GlUtil.java',
        // the phantom recipe book in the auto workbench / advanced crafting table (26.3's recipe book is different)
        'buildcraft/lib/gui/recipe/**',
        'buildcraft/lib/misc/search/VanillaSuffixArray.java',
        'buildcraft/lib/client/model/ModelPluggableItem.java',
        'buildcraft/lib/client/model/ModelItemSimple.java',
        'buildcraft/lib/client/model/ModelNotifyOfRF.java',
        'buildcraft/lib/client/reload/**',
        'buildcraft/lib/client/resource/**',
        'buildcraft/lib/client/render/CuboidRenderer.java',
        'buildcraft/lib/client/render/HudRenderer.java',
        'buildcraft/lib/client/render/fluid/SpriteFluidFrozen.java',
        'buildcraft/lib/client/render/tile/RenderMachineWave.java',
        'buildcraft/core/client/*Config*.java',
]

// transport client and GUIs (render batch / GUIs batch)
deferredSources += [
        // 1.12.2 item models built from pluggable models in code; they need special item model renderers on 26.3
        'buildcraft/silicon/client/model/ModelGateItem.java',
        'buildcraft/silicon/client/model/GateMeshDefinition.java',
        'buildcraft/silicon/client/model/plug/ModelLensItem.java',
        'buildcraft/silicon/client/model/plug/ModelFacadeItem.java',
        'buildcraft/silicon/client/FacadeItemColours.java',
        // blueprint previews draw a fake world (GUIs batch)
        'buildcraft/builders/snapshot/FakeWorld.java',
        'buildcraft/builders/snapshot/FakeChunkProvider.java',
        'buildcraft/builders/client/render/HudSingleSchematic.java',
        'buildcraft/robotics/zone/ZonePlannerMapRenderer.java',
]

def mainResourceDirs = ['buildcraft_resources', 'BuildCraft-Localization', 'BuildCraftGuide/guide_resources']

sourceSets {
    main {
        java {
            srcDirs = ['common', 'BuildCraftAPI/api',
                       'sub_projects/expression/src/main/java', 'sub_projects/expression/src/autogen/java']
            include portedPackages
            exclude deferredSources
        }
        resources {
            srcDirs = mainResourceDirs
            srcDir layout.buildDirectory.dir('generated/lang')
            // 1.12.2 .lang files become JSON (generateLang); the old 1.12.2 recipes and advancements under assets/ are
            // replaced by data/ as each module is ported.
            // (guide pages are Markdown, so only top-level readmes are left out)
            exclude '*.md', 'mcmod.info', 'pack.png', 'pack.mcmeta', '**/*.lang', 'assets/*/recipes/**',
                'assets/*/advancements/**'
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
            include portedPackages
        }
        resources { srcDirs = [] }
    }
}


def modIds = ['buildcraftlib', 'buildcraftcore', 'buildcraftbuilders', 'buildcraftenergy', 'buildcraftfactory',
              'buildcraftrobotics', 'buildcraftsilicon', 'buildcrafttransport']

neoForge {
    version = neoforge_version
    accessTransformers = files('buildcraft_resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            ideName = "BuildCraft ${it.name.capitalize()}"
            logLevel = org.slf4j.event.Level.INFO
            systemProperty 'buildcraft.dev', 'true'
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            programArgument('--nogui')
            gameDirectory = project.file('runs/server')
        }
    }

    mods {
        modIds.each { id ->
            "${id}" {
                sourceSet sourceSets.main
            }
        }
    }
}

dependencies {
    // Trove came with Minecraft 1.12.2 but not 26.3: BuildCraft bundles it (jar-in-jar)
    jarJar(implementation('net.sf.trove4j:trove4j')) {
        version {
            strictly '[3.0.3,4.0)'
            prefer '3.0.3'
        }
    }

    testImplementation 'junit:junit:4.13.2'
}

// The expression engine's generated sources (src/autogen/java) come from the sub-project's generator
tasks.named('compileJava') { dependsOn ':sub_projects:expression:generateSources' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

// Turns the 1.12.2 .lang files (English in buildcraft_resources, the rest in BuildCraft-Localization) into 26.3 JSON
// lang files with lower-case locale names.
tasks.register('generateLang') {
    def srcDirs = [file('buildcraft_resources/assets'), file('BuildCraft-Localization/assets')]
    def outDir = layout.buildDirectory.dir('generated/lang/assets').get().asFile
    inputs.files srcDirs.collect { fileTree(it).matching { include '**/lang/*.lang' } }
    outputs.dir outDir
    doLast {
        delete outDir
        srcDirs.each { File srcDir -> fileTree(srcDir).matching { include '**/lang/*.lang' }.each { File langFile ->
            def entries = new LinkedHashMap<String, String>()
            langFile.getText('UTF-8').readLines().each { String line ->
                line = line.replace('﻿', '')
                if (line.isBlank() || line.startsWith('#')) return
                int eq = line.indexOf('=')
                if (eq <= 0) return
                entries.put(line.substring(0, eq), line.substring(eq + 1))
            }
            def rel = srcDir.toPath().relativize(langFile.parentFile.toPath()).toString()
            def out = new File(new File(outDir, rel), langFile.name.replace('.lang', '.json').toLowerCase(Locale.ROOT))
            out.parentFile.mkdirs()
            out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries)), 'UTF-8')
        } }
    }
}

processResources {
    dependsOn 'generateLang'
    var expandProps = [
            'version'                      : version,
            'mod_license'                  : mod_license,
            'minecraft_version_range'      : minecraft_version_range,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range
    ]
    filesMatching('META-INF/neoforge.mods.toml') {
        expand expandProps
    }
    inputs.properties(expandProps)
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Implementation-Title'  : 'BuildCraft',
                'Implementation-Version': project.version,
                'Implementation-Vendor' : 'SpaceToad, BuildCraft Team, AlmuraDev'
        ])
    }
}
